# Cloudflare Pages project. Private preview: https://loveall-demo.pages.dev
# Final domain at launch: loveallplumbing.com (see LAUNCH.md)
name = "loveall-demo"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
# Who receives lead emails. PRE-LAUNCH: Insight only.
# At launch (see LAUNCH.md), change this one line to "tloveall10@gmail.com".
LEAD_TO = "leads@beinsight.co"
LEAD_FROM = "Loveall Website Leads <leads@beinsight.co>"
# Insight's copy of every lead. Skipped automatically while LEAD_TO is the same address.
LEAD_BCC = "leads@beinsight.co"
# RESEND_API_KEY is a secret: npx wrangler pages secret put RESEND_API_KEY --project-name loveall-demo

[[d1_databases]]
binding = "DB"
database_name = "loveall-leads"
database_id = "e87579d9-4741-403d-8c20-427257604704"
migrations_dir = "migrations"
